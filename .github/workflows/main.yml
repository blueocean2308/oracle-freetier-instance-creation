name: Oracle Auto Instance Creation

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup OCI config & key
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
        run: |
          mkdir -p ~/.oci

          # Tạo private key
          echo "$OCI_KEY_FILE" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          # Tạo config chuẩn ở ~/.oci/config
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

          # Tạo thư mục giả lập đường dẫn script đang hardcode
          sudo mkdir -p /home/ubuntu/oracle-freetier-instance-creation
          sudo chown -R $USER:$USER /home/ubuntu

          # Tạo file config đúng đường dẫn script tìm
          cat > /home/ubuntu/oracle-freetier-instance-creation/oci_config << EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF

          # Copy key sang đó luôn
          cp ~/.oci/oci_api_key.pem /home/ubuntu/oracle-freetier-instance-creation/oci_api_key.pem
          chmod 600 /home/ubuntu/oracle-freetier-instance-creation/oci_api_key.pem
          chmod 600 /home/ubuntu/oracle-freetier-instance-creation/oci_config

          echo "OCI config created successfully"
          ls -la /home/ubuntu/oracle-freetier-instance-creation/
          ls -la ~/.oci/

      - name: Run creation script
        run: |
          python main.py
